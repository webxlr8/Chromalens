<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Color Picker Tests</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }

        .pass {
            color: #4ade80;
        }

        .fail {
            color: #f87171;
        }

        .summary {
            margin-top: 20px;
            font-weight: bold;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
    </style>
</head>

<body>
    <h1>Unit Tests</h1>
    <div id="results"></div>
    <div id="summary" class="summary"></div>

    <script type="module">
        import { hexToRgb, hexToHsl } from './utils.js';

        const results = document.getElementById('results');
        let passed = 0;
        let failed = 0;

        function assert(message, actual, expected) {
            const div = document.createElement('div');
            // Simple deep equality check for objects
            const match = JSON.stringify(actual) === JSON.stringify(expected);

            if (match) {
                div.className = 'pass';
                div.textContent = `✓ ${message}`;
                passed++;
            } else {
                div.className = 'fail';
                div.textContent = `✗ ${message} - Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`;
                failed++;
            }
            results.appendChild(div);
        }

        // Tests
        try {
            // Hex to RGB
            assert('hexToRgb #000000', hexToRgb('#000000'), { r: 0, g: 0, b: 0 });
            assert('hexToRgb #FFFFFF', hexToRgb('#FFFFFF'), { r: 255, g: 255, b: 255 });
            assert('hexToRgb #FF0000', hexToRgb('#FF0000'), { r: 255, g: 0, b: 0 });
            assert('hexToRgb #00FF00', hexToRgb('#00FF00'), { r: 0, g: 255, b: 0 });
            assert('hexToRgb #0000FF', hexToRgb('#0000FF'), { r: 0, g: 0, b: 255 });

            // Hex to HSL
            assert('hexToHsl #000000', hexToHsl('#000000'), { h: 0, s: 0, l: 0 });
            assert('hexToHsl #FFFFFF', hexToHsl('#FFFFFF'), { h: 0, s: 0, l: 100 });
            assert('hexToHsl #FF0000', hexToHsl('#FF0000'), { h: 0, s: 100, l: 50 });
            // Approximate matching/rounding might be needed for HSL, but our inputs here are clean
            assert('hexToHsl #00FF00', hexToHsl('#00FF00'), { h: 120, s: 100, l: 50 });
            assert('hexToHsl #0000FF', hexToHsl('#0000FF'), { h: 240, s: 100, l: 50 });

        } catch (e) {
            const div = document.createElement('div');
            div.className = 'fail';
            div.textContent = `FATAL ERROR: ${e.message}`;
            results.appendChild(div);
            failed++;
        }

        // Summary
        const summary = document.getElementById('summary');
        summary.textContent = `Total: ${passed + failed} | Passed: ${passed} | Failed: ${failed}`;
        summary.style.color = failed === 0 ? '#4ade80' : '#f87171';

        // Signal completion to browser tool if possible (visual only here)
    </script>
</body>

</html>
